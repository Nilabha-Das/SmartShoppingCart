services:
  ai-service:
    build:
      context: ./ai-service

    container_name: smartshopping-ai
    ports:
      - "8000:8000"
    
    volumes:
      - ./ai-service/app:/app/app
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    
    environment:
      PYTHONUNBUFFERED: "1"
      GROQ_API_KEY: ${GROQ_API_KEY}

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  
  qdrant:
    image: qdrant/qdrant:latest
    container_name: smartshopping-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage: